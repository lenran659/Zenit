version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: zenit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenit_password}
      POSTGRES_DB: ${POSTGRES_DB:-zenit_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenit} -d ${POSTGRES_DB:-zenit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zenit-network

  # Next.js 前端
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenit-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-zenit}:${POSTGRES_PASSWORD:-zenit_password}@postgres:5432/${POSTGRES_DB:-zenit_db}?schema=public}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      # AI 配置（可选）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zenit-network
    # 添加迁移命令（首次启动时运行）
    command: >
      sh -c "npx drizzle-kit migrate && pnpm start"

  # 可选：如果你有后端 API 服务，取消注释下面部分
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: zenit-backend
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #     - DATABASE_URL=postgresql://${POSTGRES_USER:-zenit}:${POSTGRES_PASSWORD:-zenit_password}@postgres:5432/${POSTGRES_DB:-zenit_db}?schema=public
  #     - PORT=3001
  #   ports:
  #     - "${BACKEND_PORT:-3001}:3001"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - zenit-network

volumes:
  postgres_data:
    name: zenit-postgres-data

networks:
  zenit-network:
    name: zenit-network
    driver: bridge
